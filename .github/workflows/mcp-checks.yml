name: MCP server checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Syntax and unit tests
        run: |
          python -m compileall -q server.py
          python -m pytest -q
      - name: Unauthenticated MCP is blocked, health endpoint is public
        env:
          MCP_API_TOKEN: ci-placeholder-token-not-secret
        run: |
          python server.py > /tmp/mcp.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/health
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/mcp)
          if [ "$status" != "401" ]; then
            cat /tmp/mcp.log
            echo "Expected 401, got $status"
            exit 1
          fi
          python - <<'PY'
          import asyncio
          from mcp import ClientSession
          from mcp.client.streamable_http import streamablehttp_client

          import json

          async def check_six_sports(session):
              for sport in (
                  "football", "basketball", "tennis",
                  "american_football", "ice_hockey", "handball"
              ):
                  high = sport + "-synthetic-high"
                  low = sport + "-synthetic-low"
                  data = {"markets": [
                      {"sport": sport, "event_identifier": high, "event": "SYNTHETIC TEST",
                       "official_odds": 1.95, "source": "SYNTHETIC_NOT_VERIFIED"},
                      {"sport": sport, "event_identifier": low, "event": "SYNTHETIC TEST",
                       "official_odds": 1.55, "source": "SYNTHETIC_NOT_VERIFIED"},
                  ]}
                  response = await session.call_tool(
                      "analyze_" + sport, {"markets_json": json.dumps(data)}
                  )
                  assert not response.isError, sport
                  serialized = str(response)
                  assert "deterministic_free_only_no_api" in serialized, sport
                  assert high in serialized, sport
                  assert low not in serialized, sport
              print("All 6 sport MCP tool calls: OK (free-only 1.80+ filter)")

          async def verify():
              async with streamablehttp_client(
                  "http://127.0.0.1:10000/mcp",
                  headers={"Authorization": "Bearer ci-placeholder-token-not-secret"},
                  timeout=15,
              ) as (read, write, _):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      found = {t.name for t in (await session.list_tools()).tools}
                      expected = {
                          "analyze_football", "analyze_basketball", "analyze_tennis",
                          "analyze_american_football", "analyze_ice_hockey",
                          "analyze_handball", "get_capabilities",
                      }
                      assert found == expected, (found, expected)
                      result = await session.call_tool("get_capabilities", {})
                      assert not result.isError
                      print("Authenticated MCP initialize, tools/list, tools/call: OK")
                      await check_six_sports(session)
          asyncio.run(verify())
          PY

      - name: Public live Render Free deployment smoke test
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          origin = "https://tippmix-analyst-mcp.onrender.com"
          last = None
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(origin + "/health", timeout=120) as response:
                      assert response.status == 200
                      health = json.load(response)
                      assert health["status"] == "ok", health
                  print("Live Render /health: HTTP 200 OK")
                  break
              except Exception as exc:
                  last = type(exc).__name__ + ": " + str(exc)
                  if attempt == 4:
                      raise RuntimeError("Live health check failed: " + last)
                  time.sleep(8)
          try:
              urllib.request.urlopen(origin + "/mcp", timeout=120)
              raise AssertionError("Expected unauthenticated /mcp to be blocked")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, exc.code
          print("Live Render /mcp without token: HTTP 401 OK")
          PY
