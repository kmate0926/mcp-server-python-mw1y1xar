services:
  - type: web
    name: tippmix-analyst-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MCP_API_TOKEN
        generateValue: true
      - key: PORT
        value: "10000"
      - key: FREE_ONLY_MODE
        value: "true"
      # No paid API credentials needed in this free configuration.
